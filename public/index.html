<!doctype html>
<html lang="tr">

    <meta charset="utf-8" />

  <body style="font-family: system-ui; padding: 3rem">
    <a href="/tr/">Türkçe</a> · <a href="/de/">Deutsch</a> ·
    <a href="/en/">English</a>

</html>
